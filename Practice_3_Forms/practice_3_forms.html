<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Практика по формам</title>
    <link rel="stylesheet" href="practice_3_forms.css" />
  </head>
  <body>
    <form class="form">
      <fieldset class="form-group">
        <h3 class="form-group-title">Ваши личные данные</h3>
        <label class="label"
          >Ваше имя
          <input type="text" placeholder="Имя" name="name" required />
        </label>
        <label class="label"
          >Ваш возраст
          <input
            type="number"
            placeholder="Возраст"
            name="age"
            inputmode="numeric"
            required
          />
        </label>
        <label class="label">
          Ваш номер телефона
          <input
            type="tel"
            inputmode="tel"
            placeholder="Номер телефона"
            name="phone"
            required
          />
        </label>
        <label class="label">
          Ваша почта
          <input
            type="email"
            inputmode="email"
            name="email"
            placeholder="Почта"
            required
          />
        </label>
        <label class="label">
          Сообщение
          <textarea
            class="textarea"
            name="massege"
            placeholder="Ваше сообщение"
            required
          ></textarea>
        </label>
        <label class="checkbox-text">
          <input
            class="checkbox"
            type="checkbox"
            name="ok"
            value="ok"
            required
          />
          Я принимаю правила
        </label>
        <button class="button">Отправить</button>
      </fieldset>
    </form>
  </body>
</html>
